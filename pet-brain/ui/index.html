<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="panel">
  <header class="top">
    <svg id="pet" class="pet mood-idle" viewBox="0 0 100 100" role="img" aria-label="Pet">
      <rect class="bezel" x="6" y="22" width="88" height="56" rx="8"/>
      <rect class="screen" x="13" y="29" width="74" height="42" rx="4"/>
      <g id="eyes" class="eyes">
        <rect class="eye eye-l" x="29" y="43" width="14" height="14"/>
        <rect class="eye eye-r" x="57" y="43" width="14" height="14"/>
      </g>
      <circle class="led" cx="82" cy="74" r="1.6"/>
    </svg>
    <div class="info">
      <strong id="name">Pet</strong>
      <span id="level" class="muted">nível –</span>
      <span id="stats" class="muted">– neurônios · – conexões</span>
      <span id="brain" class="muted">cérebro: – · 0 lembretes</span>
    </div>
    <span id="conn" class="conn" title="conexão"></span>
    <button id="minimize" class="minimize" type="button" aria-label="Minimizar" hidden>—</button>
  </header>
  <section id="approvals" class="approvals" aria-live="polite"></section>
  <section id="log" class="log" aria-live="polite"></section>
  <form id="form" class="form" autocomplete="off">
    <input id="input" type="text" maxlength="8000" placeholder="Fala com o pet…" aria-label="Mensagem">
    <button id="mic" class="mic" type="button" aria-label="Falar" hidden>🎤</button>
    <button type="submit">Enviar</button>
  </form>
</main>
<script src="/app.js"></script>
</body>
</html>
