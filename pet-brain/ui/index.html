<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="panel">
  <aside class="side">
    <header class="top">
      <svg id="pet" class="pet mood-idle" viewBox="0 0 100 100" role="img" aria-label="Pet">
        <rect class="bezel" x="6" y="22" width="88" height="56" rx="8"/>
        <rect class="screen" x="13" y="29" width="74" height="42" rx="4"/>
        <g id="eyes" class="eyes">
          <rect class="eye eye-l" x="29" y="43" width="14" height="14"/>
          <rect class="eye eye-r" x="57" y="43" width="14" height="14"/>
        </g>
        <circle class="led" cx="82" cy="74" r="1.6"/>
      </svg>
      <div class="info">
        <strong id="name">Pet</strong>
        <span id="level" class="muted">nível –</span>
        <span id="stats" class="muted">– neurônios · – conexões</span>
        <span id="brain" class="muted">cérebro: – · 0 lembretes</span>
      </div>
      <div id="wave" class="wave" aria-hidden="true" title="Ouvindo… toque para parar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span id="conn" class="conn" title="conexão"></span>
      <button id="minimize" class="minimize" type="button" aria-label="Minimizar" hidden>—</button>
    </header>
    <nav id="tabs" class="tabs" aria-label="Seções" hidden>
      <button type="button" class="tab on" data-view="home">🏠 Início</button>
      <button type="button" class="tab" data-view="reminders">⏰ Lembretes</button>
      <button type="button" class="tab" data-view="habits">🌱 Hábitos</button>
      <button type="button" class="tab" data-view="media">🎵 Música</button>
      <button type="button" class="tab" data-view="peers">🔗 Aparelhos <span id="peer-count" class="badge" hidden></span></button>
    </nav>
  </aside>
  <div class="main">
    <section id="approvals" class="approvals" aria-live="polite"></section>
    <section id="view-home" class="view">
      <div id="chips" class="chips" hidden></div>
      <section id="log" class="log" aria-live="polite"></section>
      <form id="form" class="form" autocomplete="off">
        <input id="input" type="text" maxlength="8000" placeholder="Fala com o pet…" aria-label="Mensagem">
        <button id="mic" class="mic" type="button" aria-label="Microfone (ligar ou desligar)" hidden>🎤</button>
        <button type="submit">Enviar</button>
      </form>
    </section>
    <section id="view-reminders" class="view" hidden>
      <div id="timer-presets" class="chips" aria-label="Timers rápidos"></div>
      <ul id="reminder-list" class="reminder-list" aria-live="polite"></ul>
      <form id="reminder-form" class="form" autocomplete="off">
        <input id="reminder-text" type="text" maxlength="200" placeholder="Me lembra de…" aria-label="Texto do lembrete" required>
        <input id="reminder-min" class="min" type="number" min="1" max="525600" value="30" aria-label="Minutos">
        <button type="submit">Agendar</button>
      </form>
    </section>
    <section id="view-habits" class="view" hidden>
      <ul id="habit-list" class="reminder-list" aria-live="polite"></ul>
      <form id="habit-form" class="form" autocomplete="off">
        <input id="habit-name" type="text" maxlength="60" placeholder="Hábito (ex.: beber água)…" aria-label="Nome do hábito" required>
        <input id="habit-min" class="min" type="number" min="5" max="1440" value="60" aria-label="A cada quantos minutos">
        <button type="submit">Criar</button>
      </form>
    </section>
    <section id="view-media" class="view" hidden>
      <div id="media-card" class="card media">
        <div class="cover-wrap">
          <div id="media-ring" class="ring" aria-hidden="true"></div>
          <div class="cover" aria-hidden="true">
            <img id="media-img" alt="" referrerpolicy="no-referrer" hidden>
            <span id="media-note">🎵</span>
          </div>
        </div>
        <div class="np-info">
          <div class="track">
            <strong id="media-title">Nada tocando</strong>
            <span id="media-artist" class="muted">–</span>
          </div>
          <div class="seek" aria-hidden="true">
            <span id="media-pos" class="muted">0:00</span>
            <svg class="seek-bar" viewBox="0 0 200 16" preserveAspectRatio="none">
              <path id="seek-played" class="played" d="M0 8H0"/>
              <path id="seek-rest" class="rest" d="M0 8H200"/>
              <rect id="seek-knob" class="knob" x="0" y="1" width="3" height="14" rx="1.5"/>
            </svg>
            <span id="media-len" class="muted">0:00</span>
          </div>
          <div class="controls">
            <button type="button" class="round toggle" id="media-shuffle" data-media="shuffle" aria-label="Aleatório" aria-pressed="false">🔀</button>
            <button type="button" class="round" data-media="previous" aria-label="Anterior">⏮</button>
            <button type="button" class="round big" id="media-toggle" data-media="play-pause" aria-label="Tocar ou pausar">▶</button>
            <button type="button" class="round" data-media="next" aria-label="Próxima">⏭</button>
            <button type="button" class="round toggle" id="media-loop" data-media="loop" aria-label="Repetir" aria-pressed="false">🔁</button>
          </div>
          <div class="volume">
            <button type="button" class="round" data-media="volume-down" aria-label="Diminuir volume">🔉</button>
            <span id="media-volume" class="muted">–</span>
            <button type="button" class="round" data-media="volume-up" aria-label="Aumentar volume">🔊</button>
          </div>
        </div>
      </div>
    </section>
    <section id="view-peers" class="view" hidden>
      <div class="card">
        <strong>Aparelhos conectados</strong>
        <ul id="peer-list" class="peer-list"></ul>
        <div class="row">
          <button type="button" id="wave-hi">👋 Dar oi</button>
          <button type="button" id="poke">👉 Cutucar</button>
          <button type="button" id="scare">😱 Assustar</button>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
